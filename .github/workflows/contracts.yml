name: contracts

# Runs the v1 contract validation harness on every push and PR so the
# "Used by CI" claim in scripts/validate-contracts-v1.py is actually true.
# The harness validates the JSON Schemas, the in-memory canonical examples,
# the on-disk YAML router policies, and a battery of negative/consistency
# cases, including tier reachability.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate contracts
        run: python scripts/validate-contracts-v1.py
      - name: Validate skills
        run: python scripts/validate-skills.py
      - name: Check principle glance and README inventory
        run: bash scripts/check-principles-glance.sh
