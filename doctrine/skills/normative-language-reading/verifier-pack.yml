verifier_pack:
  name: normative-language-reading-verifier-pack
  skill: normative-language-reading
  version: 1.0.2
  schema_version: 1.1.0
  description: >-
    Verify that an agent report handles normative strength per claim and that any
    exception it proposes is complete. Environment: DOCTRINE_ROOT, RENDERED_PROMPT,
    REPORT. Resolution rules are executor-defined.

  setup: []
  teardown: []

  verifiers:
    - id: priming_active
      kind: priming_active
      description: The canonical priming block, hash-matched to the skill manifest, appears verbatim in the rendered prompt.
      command: python ${DOCTRINE_ROOT}/scripts/validate-skills.py assert-primed --skill normative-language-reading --prompt ${RENDERED_PROMPT}
      expected_exit: 0
      expected_stdout_contains: "priming_active: OK"
      expected_artefacts: []
      failure_mode: mark_untrusted
      severity: error
      timeout_seconds: 30

    - id: no_document_wide_strength
      kind: custom
      description: >-
        The report never assigns one BCP 14 strength to a whole document, pattern, or
        principle. custom because it inspects report text.
      command: "! grep -qiE '(this|the|whole|entire) (document|file|pattern|principle|checklist) (is|are) (a |an )?(MUST|SHOULD|MAY|required|optional|mandatory)' ${REPORT}"
      expected_exit: 0
      expected_artefacts: []
      failure_mode: mark_untrusted
      severity: error
      timeout_seconds: 10

    - id: exceptions_carry_expiry_and_authority
      kind: custom
      description: >-
        If the report proposes an exception to a doctrine claim, it names an expiry date
        and an accountable authority or approver. A proposal is approximated as a line
        that uses the word "exception" together with a capitalised MUST or SHOULD, a
        doctrine path, a section number, or a word such as propose, grant, approve,
        expire, claim, obligation, or waiver; the word alone, as in a runtime error, does
        not count. custom because it inspects report text. Passes vacuously when no
        exception is proposed.
      command: >-
        ! grep -iE '\bexception\b' ${REPORT}
        | grep -qE '(\b(MUST|SHOULD)( NOT)?\b|doctrine/|[Ss]ection [0-9]|[Pp]ropos|[Gg]rant|[Aa]pprov|[Ee]xpir|[Cc]laim|[Oo]bligation|[Ww]aiver|compensating)'
        || { grep -qiE '(expir(y|es|ation)|until|sunset)[^\n]*[0-9]{4}-[0-9]{2}-[0-9]{2}' ${REPORT} && grep -qiE '(approver|approved by|authority|accountable)' ${REPORT}; }
      expected_exit: 0
      expected_artefacts: []
      failure_mode: fail_loud
      severity: fatal
      timeout_seconds: 10

    - id: evidence_state_named
      kind: custom
      description: >-
        Where the report says evidence was stale, untrusted, unverified, or inconclusive,
        it does not also declare the same item a pass. Approximated as: none of those
        words, nor "not verified", shares a line with "pass", "passed", or "passes".
        Absent and failed evidence are not observed here, because an honest count of
        passes and failures would trip the same pattern; they stay with the reviewer.
        custom because it inspects report text.
      command: "! grep -iE '(inconclusive|not verified|unverified|untrusted|stale)' ${REPORT} | grep -qiE '\\b(pass|passed|passes)\\b'"
      expected_exit: 0
      expected_artefacts: []
      failure_mode: mark_untrusted
      severity: error
      timeout_seconds: 10
